<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulário</title>
</head>
<body>
    <form action="" method="post" onsubmit="alert('Bem vindo ao sistema')">
        <h2>Bem-vindo ao sistema</h2>
        <p>Insira seus dados para logar</p>

        <label for="">Insira seu nome de usuário:</label> <br>
        <input type="text" name="login" placeholder="Insira seu nome" required> 
        <br> <br>

        <label for="">Insira sua senha:</label> <br>
        <input type="password" name="pwd" placeholder="Insira sua senha" required> 
        <br> <br>
        
        <label for="">Insira seu e-mail:</label> <br>
        <input type="email" name="email" placeholder="Insira seu e-mail" required>
        <br> <br>

        <label for="">Qual seu meio de transporte?</label> <br>
        <input type="checkbox" name="veiculo1" value="bicicleta">
        Eu tenho uma bicicleta <br>
        <input type="checkbox" name="veiculo2" value="carro">
        Eu tenho um carro <br>
        <input type="checkbox" name="veiculo3" value="moto">
        Eu tenho uma moto <br> <br>

        <label for="">Qual seu sexo?</label> <br>
        <input type="radio" name="sexo" id="feminino" value="feminino" required>
        <label for="feminino">Feminino</label> <br>
        <input type="radio" name="sexo" id="masculino" value="masculino" required>
        <label for="masculino">Masculino</label> <br>
        <input type="radio" name="sexo" id="nao-informar" value="nao-informar" required>
        <label for="nao-informar">Prefiro não informar</label> <br> <br>

        <label for="">Data de nascimento:   </label> <br>
        <input type="date" name="nascimento">

        <br> <br>
        <input type="submit">
    </form>
</body>
</html>
