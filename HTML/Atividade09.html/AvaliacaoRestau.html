<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Atendimento Restaurante</title>
</head>
<body>
    <form action="" method="post" onsubmit="alert('Obrigado por avaliar nosso atendimento!')">

        <h2>Avaliação - Atendimento em Restaurante</h2>

        <label for="">Nome do cliente:</label> <br>
        <input type="text" name="" id="" required>
        <br> <br>

        <label for="">Data e horário da visita:</label> <br>
        <input type="datetime-local" name="" id="">
        <br> <br>

        <label for="">Forma de atendimento:</label> <br>
        <input type="radio" name="atendimento" id="presencial" value="presencial"> 
        <label for="presencial">Presencial</label> <br>
        <input type="radio" name="atendimento" id="retirada" value="retirada">
        <label for="retirada">Retirada no local</label> <br>
        <input type="radio" name="atendimento" id="entrega" value="entrega"> 
        <label for="enrega">Entrega</label>
        <br> <br>

        <label for="">Itens consumidos:</label> <br>
        <input type="checkbox" name="" id="bebidas">
        <label for="bebidas">Bebidas</label> <br>
        <input type="checkbox" name="" id="lanches">
        <label for="lanches">Lanches</label> <br>
        <input type="checkbox" name="" id="pratos">
        <label for="pratos">Pratos</label> <br>
        <input type="checkbox" name="" id="sobremesas">
        <label for="sobremesas">Sobremesas</label>
        <br> <br>

        <label for="">Nível de satisfação, de 0 a 10:</label> <br>
        Pouco satisfeito
        <input type="range" min="0" max="10">
        Muito satisfeto
        <br> <br>

        <label for="">Cor que representa a experiência do cliente:</label> <br>
        <input type="color">
        <br> <br>

        <label for="">Comentários sobre o atendimento:</label> <br>
        <textarea name="" id=""></textarea>


        <br> <br>
        <input type="submit" name="" id="">

    </form>
</body>
</html>
