<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Loja Virtual</title>
</head>
<body>

    <h2>Cadastro Cliente - Loja Virtual</h2>

    <form action="" method="post" onsubmit="alert('Bem vindo ao sistema')">

        <label for="">Insira seu nome:</label> <br>
        <input type="text" name="nome" placeholder="Insira seu nome" required>
        <br> <br>

        <label for="">Insira seu e-mail:</label> <br>
        <input type="email" name="e-mail" placeholder="Insira seu e-mail" required>
        <br> <br>

        <label for="">Insira sua senha:</label> <br>
        <input type="password" name="pwd" placeholder="Insira sua senha" required>
        <br> <br>

        <label for="">Data de nascimento</label> <br>
        <input type="date" name="nascimento" required>
        <br> <br>

        <label for="">Qual seu sexo?</label> <br>
        <input type="radio" name="sexo" id="feminino" value="feminino" required> 
        <label for="feminino">Feminino</label> <br>
        <input type="radio" name="sexo" id="masculino" value="masculino" required> 
        <label for="feminino">Masculino</label> <br>
        <input type="radio" name="sexo" id="nao-informar" value="nao-informar" required> 
        <label for="nao-informar">Prefiro não informar</label>
        <br> <br>

        <label for="">Selecione sua cor preferida:</label> <br>
        <input type="color" required>
        <br> <br>

        <label for="">Selecione sua foto de perfil:</label> <br>
        <input type="image">
        <br> <br>

        <label for="">Comentário ou observação sobre o cadastro:</label> <br>
        <textarea name="" id=""></textarea>

        <br> <br>
        <input type="submit">
    </form>
</body>
</html>
