<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Uso de Tecnologia</title>
</head>
<body>
    <form action="" method="post">

        <h2>Pesquisa - Uso de Tecnologia</h2>

        <label for="">Nome:</label> <br>
        <input type="text" required>
        <br> <br>

        <label for="">E-mail:</label> <br>
        <input type="email">
        <br> <br>

        <label for="">Data de nascimento:</label> <br>
        <input type="date"> 
        <br> <br>

        <label for="">Equipamento utilizados:</label> <br>
        <input type="checkbox" name="equipamento" id="computador" value="computador">
        <label for="computador">Computador</label> <br>

        <input type="checkbox" name="equipamento" id="tablet" value="tablet">
        <label for="tablet">Tablet</label> <br>

        <input type="checkbox" name="equipamento" id="smartphone" value="smartphone">
        <label for="smartphone">Smartphone</label> <br>

        <input type="checkbox" name="equipamento" id="videogame" value="videogame">
        <label for="videogame">Videogame</label>
        <br> <br>

        <label for="">Principal finalidade de uso:</label> <br>
        <input type="radio" name="finalidade" id="estudo" value="estudo" required>
        <label for="estudo">Estudo</label> <br>

        <input type="radio" name="finalidade" id="trabalho" value="trabalho" required>
        <label for="trabalho">Trabalho</label> <br>

        <input type="radio" name="finalidade" id="comunicacao" value="comunicação" required>
        <label for="comunicação">Comunicação</label> <br>

        <input type="radio" name="finalidade" id="jogos" value="jogos" required>
        <label for="jogos">Jogos</label> <br>

        <input type="radio" name="finalidade" id="entretenimento" value="entretenimento" required> 
        <label for="entretenimento">Entretenimento</label>
        <br> <br>

        <label for="">Quantidade de horas diárias de uso, entre 1 e 24:</label> <br>
        <input type="number" min="1" max="24"> 
        <br> <br>

        <label for="">Nível de conhecimento em tecnologia, de 0 a 10:</label> <br>
        Pouco conhecimento
        <input type="range" min="1" max="10">
        Muito conhecimento
        <br> <br>

        <label for="">Cor preferida para interfaces de sistemas:</label> <br>
        <input type="color">
        <br> <br>

        <label for="">Comentário sobre como a tecnologia faz parte de sua rotina:</label> <br>
        <textarea name="" id=""></textarea>
        <br> <br>

        <input type="submit">

    </form>
</body>
</html>
